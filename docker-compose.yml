services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safestride
      POSTGRES_PASSWORD: safestride_local
      POSTGRES_DB: safestride
    ports:
      - "5432:5432"
    volumes:
      - safestride-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safestride -d safestride"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  safestride-postgres:
